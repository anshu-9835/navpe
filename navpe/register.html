<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NavPe | Register</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="auth-body">

<div class="auth-wrapper">

    <div class="auth-brand">

        <a href="index.html" class="logo">
            <span>Nav</span>Pe<span class="logo-dot"></span>
        </a>

        <h1>Start With NavPe</h1>

        <p>
            Create your account and explore
            modern digital payment solutions.
        </p>

        <div class="auth-feature">
            ✓ Easy account setup
        </div>

        <div class="auth-feature">
            ✓ Powerful payment tools
        </div>

        <div class="auth-feature">
            ✓ Business-ready platform
        </div>

    </div>


    <div class="auth-form-container">

        <a href="index.html" class="back-home">
            ← Back to website
        </a>

        <div class="auth-form">

            <h2>Create Account</h2>

            <p>Fill in your information to get started.</p>

            <form id="registerForm">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                        type="text"
                        placeholder="Your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Business Email</label>

                    <input
                        type="email"
                        placeholder="business@example.com"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        placeholder="+91 00000 00000"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Create password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm password"
                        required
                    >

                </div>


                <button type="submit" class="primary-btn full-btn">
                    Create Account →
                </button>

                <div id="registerMessage" class="form-message"></div>

            </form>


            <div class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </div>

        </div>

    </div>

</div>

<script src="js/script.js"></script>

</body>
</html>
